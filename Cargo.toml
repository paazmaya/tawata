[package]
name = "tawata"
description = "Convert various ebook formats to markdown at command line"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
homepage = "https://github.com/paazmaya/tawata"
repository = "https://github.com/paazmaya/tawata"
license = "MIT"
keywords = ["ebook", "epub", "mobi", "djvu", "markdown"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
walkdir = "2.5.0"
regex = "1.13.1"
autocorrect = "2.14.2"
anyhow = "1.0.104"
log = "0.4.35"
env_logger = "0.11.11"

djvu-rs = "0.44.0"
boko = "0.6.0"

# OXC Native Markdown Formatting
#oxc = { version = "0.157.0", features = ["full"] }
oxc_allocator = "0.157.0"
oxc_formatter_markdown = { git = "https://github.com/oxc-project/oxc.git", tag = "crates_v0.157.0" }

[patch.crates-io]
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", tag = "crates_v0.157.0" }
