[package]
name = "epub2md-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
epub = "2.1.0" # danigm/epub-rs is published as 'epub' on crates.io
html2md = "0.2"
glob = "0.3"
walkdir = "2.0"
regex = "1.0"
autocorrect = "2.14" # The actual crate used by epub2MD for CJK/English spacing
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"