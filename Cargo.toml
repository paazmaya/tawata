[package]
name = "ebook2md-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
html2md = "0.2"
glob = "0.3"
walkdir = "2.0"
regex = "1.0"
autocorrect = "2.14"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11.11"

epub = "2.1.0"
mobi = "0.8.0"

# OXC Native Markdown Formatting
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", branch = "main" }
oxc_formatter_markdown = { git = "https://github.com/oxc-project/oxc.git", branch = "main" }

[patch.crates-io]
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", branch = "main" }