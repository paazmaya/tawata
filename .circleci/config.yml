# Rust CircleCI configuration file
version: 2.1

orbs:
  # https://circleci.com/developer/orbs/orb/codecov/codecov
  # TODO: Pin codecov CLI version on upload step
  codecov: codecov/codecov@6.1.0

jobs:
  build:
    docker:
      # https://circleci.com/developer/images/image/cimg/rust
      # TODO: Pin Docker image to immutable @sha256 digest
      - image: cimg/rust:1.99

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-rust-{{ checksum "Cargo.lock" }}

      - run:
          name: Install Rust tools
          command: |
            rustup component add clippy rustfmt
            cargo install cargo-tarpaulin --locked

      - run:
          name: Check formatting
          command: cargo fmt --all -- --check

      - run:
          name: Run Clippy
          command: cargo clippy --all-targets --all-features -- -D warnings

      - run:
          name: Generate coverage
          command: cargo tarpaulin --out Xml

      - codecov/upload

      - save_cache:
          paths:
            - /usr/local/cargo/registry
            - /usr/local/cargo/git
            - /usr/local/cargo/bin
            - target
          key: v1-rust-{{ checksum "Cargo.lock" }}

workflows:
  upload-to-codecov:
    jobs:
      - build
